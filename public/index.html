<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>같이 등산 ⛰️</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;background:#1b2b44}
#cv{position:fixed;inset:0;width:100%;height:100%}
#top{position:fixed;top:0;left:0;right:0;padding:12px 14px;color:#fff;display:flex;justify-content:space-between;align-items:flex-start;text-shadow:0 1px 3px #0008;pointer-events:none}
#top b{font-size:20px}#top .s{font-size:13px;opacity:.9}#alt{text-align:right}#alt b{font-size:24px}
#bar{position:fixed;top:64px;left:14px;right:14px;height:8px;background:#fff4;border-radius:4px}#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd54a,#ff8a3d);border-radius:4px;transition:width .2s}
#stepBtn{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);width:min(78vw,320px);height:84px;border:0;border-radius:42px;font-size:28px;font-weight:800;color:#fff;background:linear-gradient(#ff9a3d,#f0602a);box-shadow:0 6px 0 #b9441a,0 10px 24px #0006;-webkit-tap-highlight-color:transparent}
#stepBtn.jump{width:min(86vw,360px);height:96px;font-size:32px;background:linear-gradient(#4fb36f,#2f8f5b);box-shadow:0 6px 0 #1e6a41,0 10px 24px #0006;touch-action:manipulation}@media (orientation:landscape) and (max-height:500px){#stepBtn.jump{left:auto;right:20px;transform:none;width:150px;height:110px;bottom:20px}#stepBtn.jump:active{transform:translateY(5px)}}
#stepBtn:active{transform:translateX(-50%) translateY(5px);box-shadow:0 1px 0 #b9441a,0 4px 12px #0006}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:18px}
.box{max-height:100%;overflow:auto;background:#fffdf7;border-radius:22px;padding:22px;width:100%;max-width:380px;text-align:center}
.box h1{margin:0 0 4px;font-size:26px}.box p{margin:0 0 14px;color:#666;font-size:14px}
.mts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.mts button{padding:12px 6px;border:2px solid #dde;border-radius:14px;background:#fff;font-size:16px;font-weight:700}
.mts button small{display:block;font-weight:400;color:#888}.mts button.on{border-color:#f0602a;background:#fff1e8}
input{width:100%;padding:12px;border:2px solid #dde;border-radius:12px;font-size:16px;margin-bottom:12px}
.go{width:100%;padding:14px;border:0;border-radius:14px;background:#2f8f5b;color:#fff;font-size:18px;font-weight:800}
#card img{width:100%;border-radius:14px;box-shadow:0 4px 14px #0003}.row{display:flex;gap:8px;margin-top:12px}.row button{flex:1;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700}
#chg{position:fixed;top:78px;left:14px;padding:6px 10px;border:0;border-radius:10px;background:#0005;color:#fff;font-size:13px}
#rank{margin-top:10px;text-align:left;font-size:13px;background:#f4f1e8;border-radius:12px;padding:8px 12px;max-height:150px;overflow:auto}#rank div{display:flex;justify-content:space-between;padding:2px 0}#rank span{color:#777}
.hide{display:none!important}
</style></head><body>
<canvas id="cv"></canvas>
<div id="top"><div><b id="mtName">⛰️ 같이 등산</b><div class="s" id="who">산을 골라 주세요</div></div><div id="alt"><b id="myH">0m</b><div class="s" id="goal"></div></div></div>
<div id="bar"><i id="barI"></i></div>
<button id="chg">🗺️ 산 바꾸기</button><!-- 3D 버튼 숨김(3d.html 파일은 유지) -->
<button id="stepBtn">👣 한 걸음</button>
<div class="modal" id="pick"><div class="box"><h1>⛰️ 같이 등산</h1><p>버튼을 누를 때마다 한 걸음! 전국 사람들과 함께 정상까지 올라가요.</p>
<div class="mts" id="mts"></div><div class="mts" id="modes"><button data-m="walk">🚶 산책 모드<small>기본 · 편하게</small></button><button data-m="challenge">🏁 도전 모드<small>점프로 장애물 피하기 (북한산)</small></button></div><input id="nick" maxlength="10" placeholder="닉네임 (선택)"><button class="go" id="go">출발하기</button></div></div>
<div class="modal hide" id="card"><div class="box"><h1>🎉 정상 도착!</h1><img id="cardImg" alt="인증 카드"><div class="row"><button id="save" style="background:#2f8f5b;color:#fff">PNG 저장</button><button id="share" style="background:#3a6fd8;color:#fff">공유하기</button></div><div id="rank" class="hide"></div><div class="row"><button id="again" style="background:#eee">다시 오르기</button></div></div></div>
<script src="mountains.js"></script><script src="bukhan.js"></script><script src="game.js"></script><script src="app.js"></script></body></html>
